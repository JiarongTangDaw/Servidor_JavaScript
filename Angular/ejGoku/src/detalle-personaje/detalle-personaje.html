<div class="personaje-detalle" *ngIf="personajeElegido != null; else sinPersonaje">
    <img [src]="personajeElegido.img" [alt]="personajeElegido.nombre" class="img-personaje-detalle">
    <h2>{{ personajeElegido.nombre }}</h2>
    <p><strong>Raza:</strong> {{ personajeElegido.raza }}</p>
    <p><strong>Género:</strong> {{ personajeElegido.genero }}</p>
    <p><strong>Ki:</strong> {{ personajeElegido.ki }}</p>
    <p><strong>Max Ki:</strong> {{ personajeElegido.maxKi }}</p>
    <p><strong>Descripción:</strong> <br> {{ personajeElegido.descripcion }}</p>
</div>

<ng-template #sinPersonaje>
  <h2>No hay ningún personaje seleccionado</h2>
</ng-template>
